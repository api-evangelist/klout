aid: klout
name: Klout
description: >-
  Klout was a San Francisco social-analytics company, founded in 2008 by Joe Fernandez and
  Binh Tran, that scored individuals on their online social influence. The "Klout Score" was a
  single number from 1 to 100 derived from the size of a person's social network and how other
  people engaged with the content they published across connected accounts such as Twitter,
  Facebook, LinkedIn, Instagram, and Google+. Klout operated a public REST API — the Klout API
  v2 at api.klout.com — that let developers resolve a social handle to a Klout identity, look up
  a user's score and score history, and retrieve influence graphs (who a user influences and is
  influenced by) and topic affinities; access was key-based and widely used by marketing,
  CRM, and social-listening tools, and a large community of third-party client libraries grew up
  around it in Ruby, Node.js, Python, and PHP. Lithium Technologies acquired Klout on 27 March
  2014 for approximately $200 million. Lithium retired Klout as a standalone service on 25 May
  2018 — the day the EU General Data Protection Regulation took effect — stating that Klout's
  AI and machine-learning capabilities were valuable to Lithium but the consumer service was not
  aligned with its long-term strategy. The Klout API was shut down with the service. Lithium has
  since been rebranded as Khoros, and klout.com now redirects into the Khoros website. The
  company is defunct and operates no live API; this profile is retained as a historical provider
  record in the API Evangelist network.
