note: >-
  No first-party Klout SDK was ever published to a public package registry, and none was found in
  the Klout GitHub organization (github.com/klout contains only archived forks and mirrors of
  third-party infrastructure projects). Every package listed below is a COMMUNITY-maintained
  wrapper around the now-retired Klout API v2, catalogued here as a historical record of the
  developer ecosystem that formed around the API. All of them are non-functional today: the Klout
  API was shut down with the service on 2018-05-25 and api.klout.com no longer resolves. No
  package is marked official, and no SDKs pointer is wired in apis.yml.
